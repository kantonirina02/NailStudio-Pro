<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Administration NailBloom</title>

    <!-- Google Fonts & Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f8f9fa;
        }

        .sidebar {
            min-height: 100vh;
            background-color: #2C2C2C;
            color: white;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.7);
        }

        .nav-link:hover,
        .nav-link.active {
            color: #D4AF37;
        }

        .accent-text {
            color: #D4AF37;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- Barre latérale (Sidebar) -->
            <div class="col-md-3 col-lg-2 px-0 sidebar shadow">
                <div class="d-flex flex-column p-3 pt-4 h-100">
                    <a href="#"
                        class="d-flex align-items-center mb-5 mb-md-0 me-md-auto text-white text-decoration-none">
                        <span class="fs-4 fw-bold"><span class="accent-text">Nail</span>Bloom</span>
                    </a>
                    <hr class="border-secondary">
                    <ul class="nav nav-pills flex-column mb-auto gap-2">
                        <li class="nav-item">
                            <a href="#" class="nav-link active" aria-current="page">
                                <i class="bi bi-calendar-check me-2"></i> Réservations
                            </a>
                        </li>
                        <li>
                            <a href="#" class="nav-link">
                                <i class="bi bi-images me-2"></i> Galerie
                            </a>
                        </li>
                    </ul>
                    <hr class="border-secondary">
                    <!-- Bouton Déconnexion -->
                    <button id="btnLogout" class="btn btn-outline-light w-100 text-start">
                        <i class="bi bi-box-arrow-right me-2"></i> Déconnexion
                    </button>
                </div>
            </div>

            <!-- Contenu principal -->
            <div class="col-md-9 col-lg-10 p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold">Gestion des Rendez-vous</h2>
                    <span id="adminEmailDisplay" class="badge bg-secondary rounded-pill py-2 px-3">Chargement...</span>
                </div>

                <!-- Tableau des réservations -->
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="py-3 px-4">Date</th>
                                        <th class="py-3">Heure</th>
                                        <th class="py-3">Prestation</th>
                                        <th class="py-3">Statut</th>
                                        <th class="py-3 text-end px-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="reservationsTableBody">
                                    <!-- Le JavaScript va injecter les lignes de tableau ici -->
                                    <tr>
                                        <td colspan="5" class="text-center py-5 text-muted">
                                            <div class="spinner-border spinner-border-sm text-secondary me-2"
                                                role="status"></div>
                                            Chargement des réservations...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Script Module -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="dashboard.js"></script>
</body>

</html>
