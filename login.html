<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Administration NailBloom</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- CSS Personnalisé -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-primary-custom d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">

                    <!-- En-tête -->
                    <div class="text-center mb-4">
                        <h1 class="font-heading fs-3 fw-bold"><span class="text-accent">Nail</span>Bloom</h1>
                        <p class="text-muted small text-uppercase tracking-wider">Espace Administrateur</p>
                    </div>

                    <!-- Boîte d'erreur (cachée par défaut) -->
                    <div id="loginError" class="alert alert-danger d-none small text-center" role="alert">
                        Identifiants incorrects.
                    </div>

                    <!-- Formulaire de connexion -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label text-muted small">Adresse email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i
                                        class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="emailInput" class="form-control border-0 bg-light py-2"
                                    required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted small">Mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0"><i
                                        class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="passwordInput" class="form-control border-0 bg-light py-2"
                                    required>
                            </div>
                        </div>

                        <button type="submit"
                            class="btn btn-dark w-100 py-2 rounded-pill fw-medium btn-hover-accent mb-3">
                            Se connecter
                        </button>

                        <div class="text-center">
                            <a href="index.html" class="text-muted small text-decoration-none hover-accent">
                                <i class="bi bi-arrow-left"></i> Retour au site
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Scripts Firebase et Logique Admin -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="admin.js"></script>
</body>

</html>
